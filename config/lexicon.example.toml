# Pronunciation overrides applied before synthesis (Kokoro/misaki).
# Copy to config/lexicon.toml and add your own entries.
#
# Each entry maps a whole word (case-sensitive) to misaki modified-IPA; the
# renderer rewrites it to `[word](/ipa/)`, which Kokoro honors down to the audio.
#
# misaki modified-IPA notation:
#   capital O = "oh" diphthong, I = "eye", A = "ay"; ˈ = primary stress, ˌ = secondary.
#   ɹ = American r, ð = "th" (this), θ = "th" (thin).
# Tip (avoid guessing): phonemize a word it ALREADY says right and copy the output:
#   .venv/bin/python -c "from misaki import en; print(en.G2P(trf=False)('red')[0])"
# WARNING: misaki does not validate the IPA — wrong symbols produce garbled audio.
# WARNING: never put punctuation in an IPA value. A comma survives into the phoneme
#   stream and Kokoro voices it as a ~105ms pause mid-sentence. Separate letters with
#   stress marks (ˌAˈI), not commas. tests/test_normalize.py enforces this.
#
# The entries below are a useful starting set for a tech/AI show. Trim or extend
# to fit your subject matter.

[words]
Kokoro = "kˈOkəɹO"
exile = "ˈɛksaɪl"          # "EKS-ile" — misaki's default ˈɛɡzˌIl voices the s as a z

# Rhetoric / debate terms — misaki reduces the "man" in the one-word compounds
# to a schwa ("steelman" -> stˈilmən). Force a clear "man" (mˌæn).
steelman = "stˈil mˌæn"
"steel man" = "stˈil mˌæn"
strawman = "stɹˈɔ mˌæn"
"straw man" = "stɹˈɔ mˌæn"

# Domains / registries / drop-catching brands (misaki returns ❓ for several)
ICANN = "ˈIkæn"            # "EYE-can" — normalizer whitelists it so the lexicon wins
Verisign = "vˈɛɹɪsˌIn"     # VAIR-ih-sine
Dynadot = "dˈInədˌɑt"      # DYE-nuh-dot
Namecheap = "nˈAmʧˌip"     # NAME-cheep
Pheenix = "fˈinɪks"        # FEE-nix (the drop-catcher, said like "phoenix")

# --- Technology / AI / networking ---
# Acronyms spelled letter-by-letter
AI = "ˌAˈI"                # "ay-EYE". NO comma: a literal comma survives into the phoneme
                           # stream and Kokoro voices it as a 105ms mid-sentence pause (measured),
                           # so "AI models" aired as "AI, models". This is misaki's own reading of
                           # "A.I." — the diphthongs stay distinct without any break.
AGI = "ˈA ʤˈi ˈI"
LLM = "ˌɛl ˌɛl ˈɛm"
GPT = "ʤˈi pˈi tˈi"
RLHF = "ɑɹ ˌɛl ˈAʧ ˈɛf"
NLP = "ˈɛn ˌɛl pˈi"
API = "ˈA pˈi ˈI"
DNS = "dˈi ˈɛn ˈɛs"
CDN = "sˈi dˈi ˈɛn"
SSL = "ˈɛs ˈɛs ˌɛl"
TLS = "tˈi ˌɛl ˈɛs"
TCP = "tˈi sˈi pˈi"
