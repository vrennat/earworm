gRPC = "ʤˈi ɑɹ pˈi sˈi"
DHCP = "dˈi ˈAʧ sˈi pˈi"
IPv6 = "ˈI pˈi vˈi sˈɪks"
npm = "ˈɛn pˈi ˈɛm"
