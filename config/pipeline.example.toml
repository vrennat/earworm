# Stage timing and optional review passes. Models, API/local providers, bounded
# fallback, and spending live in llm.toml. No Claude login or CLI is used.
# CLI --model overrides the model ID on each stage's configured provider.

[pipeline.research]
timeout = 1800

[pipeline.review]
enabled = true
timeout = 1200

[pipeline.script]
timeout = 900

[pipeline.script_review]
enabled = true
timeout = 900

[pipeline.revise]
timeout = 900

[pipeline.autogen]
timeout = 600

[pipeline.dedup]
timeout = 180
